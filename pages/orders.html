<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolex — My Orders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .order-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; transition: border-color 0.3s; }
        .order-card:hover { border-color: var(--gold); }
        .order-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
        .order-id { font-family: var(--heading-font); font-size: 1.3rem; font-weight: 600; }
        .order-date { font-size: 0.85rem; color: var(--text-muted); }
        .order-status { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
        .status-processing { background: rgba(201,162,39,0.15); color: var(--gold); }
        .status-shipped { background: rgba(39,162,201,0.15); color: #27a2c9; }
        .status-delivered { background: rgba(39,201,80,0.15); color: #27c950; }
        .order-items { display: flex; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
        .order-item { display: flex; align-items: center; gap: 0.75rem; }
        .order-item img { width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
        .order-item-name { font-weight: 600; font-size: 0.95rem; }
        .order-item-qty { font-size: 0.8rem; color: var(--text-muted); }
        .order-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 1rem; border-top: 1px solid var(--border-color); }
        .order-total-label { font-size: 0.9rem; color: var(--text-muted); }
        .order-total-value { font-size: 1.4rem; font-weight: 600; color: var(--gold); }
        .order-address { font-size: 0.85rem; color: var(--text-muted); }
        @media (max-width: 576px) {
            .order-header { flex-direction: column; align-items: flex-start; }
            .order-item img { width: 44px; height: 44px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="../Home Page/index.html" class="logo-content flex">
                <i class='bx bx-crown bx-flip-horizontal logo-icon'></i>
                <span class="logo-text">ROLEX</span>
            </a>
            <div class="menu-content">
                <ul class="menu-list flex">
                    <li><a href="../Home Page/index.html" class="nav-link">HOME</a></li>
                    <li><a href="../Home Page/index.html#collection" class="nav-link">COLLECTION</a></li>
                    <li><a href="orders.html" class="nav-link active">MY ORDERS</a></li>
                    <li><a href="wallet.html" class="nav-link">WALLET</a></li>
                </ul>
                <i class='bx bx-x navClose-btn' role="button" aria-label="Close menu"></i>
            </div>
            <div class="contact-content flex">
                <a href="#" aria-label="Account"><i class='bx bx-user user-icon'></i></a>
                <a href="cart.html" class="cart-link" aria-label="Cart"><i class='bx bx-cart-alt cart-icon'></i><span class="cart-count" aria-live="polite">0</span></a>
            </div>
            <i class='bx bx-menu navOpen' role="button" aria-label="Open menu"></i>
        </nav>
    </header>

    <main class="page-wrapper">
        <h1 class="page-title">My Orders</h1>
        <div id="ordersContent"></div>
    </main>

    <section class="section footer" id="footer"></section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/utils.js"></script>
    <script>
    (function() {
        var container = document.getElementById('ordersContent');
        var bp = basePath();

        if (!isLoggedIn()) {
            container.innerHTML =
                '<div class="empty-state">' +
                    '<i class="bx bx-lock"></i>' +
                    '<h3>Sign in to view your orders</h3>' +
                    '<p>You need to be logged in to see your order history.</p>' +
                    '<a href="' + bp + 'Login Sign up Page/login.html?returnUrl=' + encodeURIComponent(window.location.href) + '" class="btn btn-gold btn-gold-filled">Sign In</a>' +
                '</div>';
            initSharedUI();
            initMobileMenu();
            return;
        }

        var orders = getOrders();

        if (orders.length === 0) {
            container.innerHTML =
                '<div class="empty-state">' +
                    '<i class="bx bx-package"></i>' +
                    '<h3>No orders yet</h3>' +
                    '<p>When you place an order, it will appear here.</p>' +
                    '<a href="../Home Page/index.html#collection" class="btn btn-gold">Start Shopping</a>' +
                '</div>';
            initSharedUI();
            initMobileMenu();
            return;
        }

        var html = '';
        orders.forEach(function(order) {
            var statusClass = 'status-' + (order.status || 'processing');
            html += '<div class="order-card">';
            html += '<div class="order-header">';
            html += '<div><span class="order-id">Order #' + escapeHtml(order.id) + '</span><br><span class="order-date">' + escapeHtml(order.date) + '</span></div>';
            html += '<span class="order-status ' + statusClass + '">' + escapeHtml(order.status || 'processing') + '</span>';
            html += '</div>';

            html += '<div class="order-items">';
            if (order.items && order.items.length) {
                order.items.forEach(function(item) {
                    var imgSrc = getProductImagePath(item.image || item.img);
                    html += '<div class="order-item">';
                    html += '<img src="' + escapeHtml(imgSrc) + '" alt="' + escapeHtml(item.name) + '">';
                    html += '<div><div class="order-item-name">' + escapeHtml(item.name) + '</div><div class="order-item-qty">Qty: ' + item.quantity + ' · ' + money.format(item.price) + '</div></div>';
                    html += '</div>';
                });
            }
            html += '</div>';

            if (order.address) {
                html += '<div class="order-address"><i class="bx bx-map"></i> ' + escapeHtml(order.address) + '</div>';
            }
            if (order.paymentMethod) {
                html += '<div class="order-payment" style="font-size:0.85rem; color:var(--text-muted); margin-top:0.3rem;"><i class="bx bx-credit-card"></i> Paid via: ' + escapeHtml(order.paymentMethod.toUpperCase()) + '</div>';
            }

            html += '<div class="order-footer">';
            html += '<span class="order-total-label">Total</span>';
            html += '<span class="order-total-value">' + money.format(order.total) + '</span>';
            html += '</div>';
            html += '</div>';
        });

        container.innerHTML = html;
        initMobileMenu();
        initSharedUI();
    })();

    function initMobileMenu() {
        var navOpen = document.querySelector('.navOpen');
        var navClose = document.querySelector('.navClose-btn');
        var menuContent = document.querySelector('.menu-content');
        if (navOpen) navOpen.addEventListener('click', function() { menuContent.classList.add('open'); });
        if (navClose) navClose.addEventListener('click', function() { menuContent.classList.remove('open'); });
    }
    </script>
</body>
</html>
