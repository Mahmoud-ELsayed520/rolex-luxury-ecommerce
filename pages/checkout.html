<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolex — Checkout</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="../css/shared.css">
    <style>
        .checkout-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 2.5rem; }
        .checkout-form h2 { font-family: var(--heading-font); font-size: 2rem; font-weight: 600; letter-spacing: 0.06em; }
        .checkout-note { margin: 0.4rem 0 1.5rem; font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
        .field { margin-bottom: 1rem; }
        .field label { display: block; margin-bottom: 0.35rem; font-size: 0.85rem; letter-spacing: 0.06em; color: #ccc; }
        .field input, .field textarea {
            width: 100%; padding: 0.7rem 0.8rem;
            background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 0;
            color: var(--text-color); font-family: var(--body-font); font-size: 1rem;
            transition: border-color var(--tran-0-3) ease, box-shadow var(--tran-0-3) ease;
        }
        .field textarea { resize: vertical; }
        .field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,162,39,0.2); }
        .field input:user-invalid { border-color: #c0564a; }
        .checkout-summary { align-self: start; padding: 1.5rem; background: var(--bg-surface); border: 1px solid var(--border-color); }
        .checkout-summary h3 { margin-bottom: 0.5rem; font-size: 1.1rem; font-weight: 600; }
        .summary-line { display: flex; align-items: center; gap: 0.9rem; padding: 0.8rem 0; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: #ccc; }
        .summary-line img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; }
        .summary-line div { flex: 1; min-width: 0; }
        .summary-line strong { display: block; font-weight: 600; color: var(--text-color); }
        .summary-line small { color: var(--text-muted); }
        .summary-line span { white-space: nowrap; color: var(--text-color); }
        .summary-total { display: flex; justify-content: space-between; margin-top: 1rem; font-size: 1rem; color: #ccc; }
        .summary-total strong { font-size: 1.5rem; font-weight: 600; color: var(--gold); }
        .payment-select { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .payment-option { flex: 1; min-width: 120px; padding: 1rem; background: var(--bg-surface); border: 1px solid var(--border-color); cursor: pointer; text-align: center; transition: border-color 0.3s; border-radius: 0; }
        .payment-option:hover, .payment-option.selected { border-color: var(--gold); }
        .payment-option i { font-size: 1.5rem; color: var(--gold); display: block; margin-bottom: 0.3rem; }
        .payment-option span { font-size: 0.85rem; color: #ccc; }
        .checkout-done { display: none; flex-direction: column; align-items: center; padding: 2rem 1rem; text-align: center; }
        .checkout-done.active { display: flex; }
        .checkout-done .bx { font-size: 3.5rem; color: var(--gold); margin-bottom: 0.75rem; }
        .checkout-done p { font-size: 1.05rem; color: #ccc; }
        .auth-notice { background: var(--bg-surface); border: 1px solid var(--gold); padding: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
        .auth-notice p { color: #ccc; margin-bottom: 1rem; }
        @media (max-width: 800px) {
            .checkout-grid { grid-template-columns: 1fr; gap: 1.5rem; }
            .checkout-summary { order: -1; }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="../Home Page/index.html" class="logo-content flex">
                <i class='bx bx-crown bx-flip-horizontal logo-icon'></i>
                <span class="logo-text">ROLEX</span>
            </a>
            <div class="menu-content">
                <ul class="menu-list flex">
                    <li><a href="../Home Page/index.html" class="nav-link">HOME</a></li>
                    <li><a href="../Home Page/index.html#collection" class="nav-link">COLLECTION</a></li>
                    <li><a href="orders.html" class="nav-link">MY ORDERS</a></li>
                    <li><a href="wallet.html" class="nav-link">WALLET</a></li>
                </ul>
                <i class='bx bx-x navClose-btn' role="button" aria-label="Close menu"></i>
            </div>
            <div class="contact-content flex">
                <a href="#" aria-label="Account"><i class='bx bx-user user-icon'></i></a>
                <a href="cart.html" class="cart-link" aria-label="Cart"><i class='bx bx-cart-alt cart-icon'></i><span class="cart-count" aria-live="polite">0</span></a>
            </div>
            <i class='bx bx-menu navOpen' role="button" aria-label="Open menu"></i>
        </nav>
    </header>

    <main class="page-wrapper">
        <h1 class="page-title">Checkout</h1>
        <div id="checkoutContent"></div>
    </main>

    <section class="section footer" id="footer"></section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="../js/utils.js"></script>
    <script>
    (function() {
        var container = document.getElementById('checkoutContent');
        var cart = loadCart();
        var bp = basePath();
        var selectedPayment = 'card';

        // Auth gate
        if (!isLoggedIn()) {
            container.innerHTML =
                '<div class="auth-notice">' +
                    '<i class="bx bx-lock" style="font-size:2.5rem; color:var(--gold); display:block; margin-bottom:0.5rem;"></i>' +
                    '<p>Please sign in to complete your order.</p>' +
                    '<a href="' + bp + 'Login Sign up Page/login.html?returnUrl=' + encodeURIComponent(window.location.href) + '" class="btn btn-gold btn-gold-filled">Sign In</a>' +
                    ' <a href="' + bp + 'Login Sign up Page/signup.html?returnUrl=' + encodeURIComponent(window.location.href) + '" class="btn btn-gold" style="margin-left:0.5rem;">Create Account</a>' +
                '</div>';
            initSharedUI();
            initMobileMenu();
            return;
        }

        // Empty cart
        if (cart.length === 0) {
            container.innerHTML =
                '<div class="empty-state">' +
                    '<i class="bx bx-cart"></i>' +
                    '<h3>Nothing to check out</h3>' +
                    '<p>Your cart is empty. Add some watches first!</p>' +
                    '<a href="../Home Page/index.html#collection" class="btn btn-gold">Explore Collection</a>' +
                '</div>';
            initSharedUI();
            initMobileMenu();
            return;
        }

        var user = getCurrentUser();
        var total = getCartTotal(cart);

        // Build summary HTML
        var summaryHtml = '';
        cart.forEach(function(item) {
            summaryHtml +=
                '<div class="summary-line">' +
                    '<img src="' + escapeHtml(getProductImagePath(item.img)) + '" alt="">' +
                    '<div><strong>' + escapeHtml(item.name) + '</strong><small>Qty ' + item.qty + '</small></div>' +
                    '<span>' + money.format(item.price * item.qty) + '</span>' +
                '</div>';
        });

        container.innerHTML =
            '<div id="formView" class="checkout-grid">' +
                '<div class="checkout-form">' +
                    '<h2>Shipping Details</h2>' +
                    '<p class="checkout-note">This is a demo store. No payment is taken.</p>' +
                    '<form id="coForm">' +
                        '<div class="field"><label for="co-name">Full name</label><input id="co-name" name="name" type="text" autocomplete="name" required value="' + escapeHtml(user ? user.name : '') + '"></div>' +
                        '<div class="field"><label for="co-email">Email</label><input id="co-email" name="email" type="email" autocomplete="email" required value="' + escapeHtml(user ? user.email : '') + '"></div>' +
                        '<div class="field"><label for="co-phone">Phone</label><input id="co-phone" name="phone" type="tel" autocomplete="tel" required></div>' +
                        '<div class="field"><label for="co-address">Address</label><input id="co-address" name="address" type="text" autocomplete="street-address" required></div>' +
                        '<div class="field"><label for="co-city">City</label><input id="co-city" name="city" type="text" autocomplete="address-level2" required></div>' +
                        '<div class="field"><label>Payment Method</label>' +
                            '<div class="payment-select">' +
                                '<div class="payment-option selected" data-method="card"><i class="bx bx-credit-card"></i><span>Card</span></div>' +
                                '<div class="payment-option" data-method="wallet"><i class="bx bx-wallet"></i><span>Wallet</span></div>' +
                                '<div class="payment-option" data-method="cod"><i class="bx bx-money"></i><span>Cash</span></div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="field"><label for="co-notes">Notes (optional)</label><textarea id="co-notes" name="notes" rows="2"></textarea></div>' +
                        '<button type="submit" class="btn btn-gold btn-gold-filled" style="width:100%;">Place Order</button>' +
                    '</form>' +
                '</div>' +
                '<div class="checkout-summary">' +
                    '<h3>Order Summary</h3>' +
                    summaryHtml +
                    '<div class="summary-total"><span>Total</span><strong aria-live="polite">' + money.format(total) + '</strong></div>' +
                '</div>' +
            '</div>' +
            '<div id="doneView" class="checkout-done">' +
                '<i class="bx bx-check-circle"></i>' +
                '<h2 id="doneTitle" style="font-family:var(--heading-font); font-size:2rem; font-weight:600;">Thank you</h2>' +
                '<p id="doneOrder"></p>' +
                '<p class="checkout-note">This is a demo — nothing was charged.</p>' +
                '<div style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;">' +
                    '<a href="orders.html" class="btn btn-gold btn-gold-filled">View My Orders</a>' +
                    '<a href="../Home Page/index.html" class="btn btn-gold">Continue Shopping</a>' +
                '</div>' +
            '</div>';

        // Payment method selection
        var paymentOptions = container.querySelectorAll('.payment-option');
        paymentOptions.forEach(function(opt) {
            opt.addEventListener('click', function() {
                paymentOptions.forEach(function(o) { o.classList.remove('selected'); });
                opt.classList.add('selected');
                selectedPayment = opt.dataset.method;
            });
        });

        // Form submission
        var form = document.getElementById('coForm');
        var submitBtn = form.querySelector('button[type="submit"]');
        var isSubmitting = false;

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (isSubmitting) return;

            // Immediately disable submit button and update text
            isSubmitting = true;
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Processing...';
            }

            function resetSubmitState() {
                isSubmitting = false;
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Place Order';
                }
            }

            // Double-check auth
            if (!isLoggedIn()) {
                resetSubmitState();
                requireAuth();
                return;
            }
            if (cart.length === 0) {
                resetSubmitState();
                return;
            }

            var fd = new FormData(form);
            var name = (fd.get('name') || '').trim();
            var email = (fd.get('email') || '').trim();
            var phone = (fd.get('phone') || '').trim();
            var address = (fd.get('address') || '').trim();
            var city = (fd.get('city') || '').trim();
            var orderNumber = 'RLX-' + Date.now().toString(36).toUpperCase().slice(-6);
            var user = getCurrentUser();

            // Wallet payment check
            if (selectedPayment === 'wallet') {
                var wallet = getWallet();
                if (wallet.balance < total) {
                    alert('Insufficient wallet balance. Your balance is ' + money.format(wallet.balance));
                    resetSubmitState();
                    return;
                }
                walletDeduct(total, 'Order ' + orderNumber);
            }

            var orderItems = cart.map(function(item) {
                return { name: item.name, price: item.price, quantity: item.qty, image: item.img };
            });

            var newOrder = {
                id: orderNumber.replace('RLX-', ''),
                date: new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),
                status: 'processing',
                customerName: name || (user ? user.name : 'Client'),
                userEmail: user ? user.email : email,
                email: email,
                phone: phone,
                address: (address ? address + ', ' : '') + city,
                paymentMethod: selectedPayment,
                items: orderItems,
                shipping: 0,
                subtotal: total,
                total: total
            };

            saveOrder(newOrder);

            // Clear cart
            saveCart([]);
            updateCartBadge();

            // Show done view
            document.getElementById('formView').style.display = 'none';
            var doneView = document.getElementById('doneView');
            doneView.classList.add('active');
            document.getElementById('doneTitle').textContent = name ? 'Thank you, ' + name.split(' ')[0] : 'Thank you';
            document.getElementById('doneOrder').textContent = 'Order ' + orderNumber + ' · ' + money.format(total);
        });

        initMobileMenu();
        initSharedUI();
    })();

    function initMobileMenu() {
        var navOpen = document.querySelector('.navOpen');
        var navClose = document.querySelector('.navClose-btn');
        var menuContent = document.querySelector('.menu-content');
        if (navOpen) navOpen.addEventListener('click', function() { menuContent.classList.add('open'); });
        if (navClose) navClose.addEventListener('click', function() { menuContent.classList.remove('open'); });
    }
    </script>
</body>
</html>
